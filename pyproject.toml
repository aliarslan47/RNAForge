[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaforge"
version = "0.1.0"
description = "RNAForge — Bulk RNA-seq analiz pipeline'ı"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
rnaforge = "rnaforge.cli:main"

[tool.setuptools.packages.find]
include = ["rnaforge*"]

[tool.setuptools.package-data]
rnaforge = ["profiles/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Cila taraması: `ruff check rnaforge` — kullanılmayan import / ölü kod / bariz hatalar.
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9"]  # F: pyflakes (unused/undefined), E9: syntax hataları
