name: metatranscriptome
permissive: true
description: >
  Referans-tabanlı kısa-okuma metatranskriptom (topluluk RNA-seq). Eşikler BİLİNÇLİ olarak
  permissive ve DAMGALIDIR: gen kataloğu doğası gereği eksiktir (topluluğun tümü referansta
  yoktur) → düşük hizalama/atama NORMALDİR, geçersizlik değildir. Yalnız KATASTROFİK (~0)
  hizalama şüpheli (WARN). rRNA depletion verimi düşükse WARN. replicate_correlation korunur.
  Bu profille üretilen rapor "geniş toleranslı" damgası taşır; temsili bir metatranskriptom
  veri setine kalibre edilene dek sıkılaştırılmaz. survival_rate (m03 kısa-okuma trim
  kapısı) permissive (prokaryote_long ile aynı felsefe, 0.20): topluluk okuması rRNA-zengin
  olabilir, agresif fastp filtresi sonrası düşük survival ŞÜPHELİ ama tek başına geçersiz
  değildir. NOT: m03._trim_short bu eşiği hâlâ FAIL olarak uygular (warn_only yalnız
  uzun-okuma kolunda) — 0.20'nin altı yine de koşuyu durdurur; bu, mevcut m03 short-read
  davranışının minimum-uyumlu düzeltmesidir, WARN'a gevşetme bu görevin kapsamı DIŞINDA.
thresholds:
  read_depth: 1000000
  base_quality: 20
  survival_rate: 0.20
  rrna_depletion_rate: 0.30
  alignment_rate: 0.05
  assignment_rate: 0.02
  replicate_correlation: 0.75
