# RNAForge — Mouse NSC WT vs Smchd1-null (ökaryot UZUN-okuma İZOFORM doğrulaması).
# Veri: PRJNA637390 (Dong et al., NAR Genom Bioinform 2021, doi:10.1093/nargab/lqab028).
# ONT direct-cDNA (SQK-DCS), PromethION. Kanonik ONT DTU benchmark (Ritchie lab).
# Doğrulama: (gen) Smchd1 DOWN [knockout], Ndn/Mkrn3/Peg12 UP; (izoform-DTU) Pisd
# ENSMUST00000201980 (Pisd-212) null'da UP.
organism: "Mus musculus"
organism_type: "eukaryote"
platform: "ont"

reference:
  transcriptome_fasta: "references/mouse_vm25/transcriptome.fa"
  tx2gene: "references/mouse_vm25/tx2gene.tsv"

library:
  strandedness: "unstranded"
  selection: "polya"
  chemistry: "cdna"            # ONT direct-cDNA (SQK-DCS)
  full_length_cdna: false      # DCS'te SSP/VNP PCR-primeri yok → Pychopper atla, chopper-only

trimming:
  min_length: 100
  aggressive_quality: false

de:
  design: "~condition"
  reference: "WT"              # kontrast referansı = WT → pozitif log2FC = null'da UP
  fdr_threshold: 0.05
  log2fc_threshold: 1.0

report:
  language: "tr"

resources:
  threads: 8
  memory_gb: 32
