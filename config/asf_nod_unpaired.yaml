# RNAForge — Altered Schaedler Flora (ASF) gnotobiyotik NOD-fare bağırsak metatranskriptomu.
# EŞLEŞTİRMESİZ (~condition) varyant — asf_nod.yaml'in kopyası, yalnız DE modeli değişik.
# Neden: n=3, topluluk 2 türle domine → eşleştirilmiş "~subject + condition" 3 residual df
#   bırakıyor; "~condition" (eşleştirmesiz) 4 residual df verir → daha güçlü DE testi.
#   Sınırlı güç kontrolü; eşleştirilmiş run runs/20260821_142941_asf_nod korunur (ayrı run-id).
# Veri: SRP012007 (Illumina GAIIx, single-end 76 bp). Tanımlı 8-türlü community → mikrobiyom.
# Kontrast: SEKUM vs KOLON (anatomik bölge), 3v3 (eşleştirme yok).
# Katalog: 8 ASF genomu (RefSeq/GenBank) birleşik gene_catalog.fna + .gff (124 kontig, 31.339 CDS).
organism: "Altered Schaedler Flora (ASF) — gnotobiotic NOD mouse gut metatranscriptome (unpaired)"
organism_type: "metatranscriptome"
platform: "illumina"

# Eşleştirmesiz koşuyu BİLEREK beyan et: veri eşleştirilmiş-görünse de (m1/m2/m4 iki bölgede)
# design'da 'subject' yok → m01_validate _paired_gate FAIL'ini önlemek için paired: false zorunlu.
paired: false

reference:
  gene_catalog_fasta: "references/asf/gene_catalog.fna"
  catalog_annotation: "references/asf/gene_catalog.gff"

taxonomy:
  kraken2_db: "references/kraken2/asf"
  bracken_read_len: 75
  bracken_level: "S"

rrna:
  db_fasta: "references/asf/asf_rrna.fasta"

library:
  strandedness: "unstranded"
  selection: "rrna_depletion"

quantification:
  feature_type: "CDS"
  attribute: "locus_tag"

de:
  design: "~condition"             # eşleştirmesiz: bölge tek faktör (subject kovaryatı yok)
  reference: "cecum"               # sekum = baz; kolon'daki artış = +log2FC
  fdr_threshold: 0.05
  log2fc_threshold: 1.0

report:
  language: "tr"

resources:
  threads: 8
  memory_gb: 32
